<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Banku.ua{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: #7c6fff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 20px 24px;
      text-align: center;
    }
    header .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    header .logo span { color: #7c6fff; }
    header .sub {
      font-size: 0.82rem;
      color: #666;
      margin-top: 4px;
    }

    main {
      flex: 1;
      max-width: 780px;
      margin: 36px auto;
      padding: 0 16px;
      width: 100%;
    }

    footer {
      background: #111;
      border-top: 1px solid #1e1e1e;
      color: #444;
      text-align: center;
      padding: 16px;
      font-size: 0.78rem;
    }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>

  <header>
    <div class="logo"><a href="/" style="color:#fff; text-decoration:none;">🏦 Banku<span>.ua</span></a></div>
    <div class="sub">Швидкий перехід до вашого банку</div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer>© 2026 Banku.ua — посилання відкриваються на офіційних сайтах банків</footer>

</body>
</html>
